[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "parking-lot"
version = "2.0.0"
description = "A REST-based parking lot low-level design exercise"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
]

[tool.setuptools.packages.find]
include = ["parking_lot*"]

[tool.setuptools.package-data]
parking_lot = ["schema.sql"]